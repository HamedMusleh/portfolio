<section id="projects" class="container" aria-labelledby="projects-title">
  <app-section-heading
    index="02"
    title="Featured Projects"
    headingId="projects-title"
    intro="Selected work across AI, full-stack, mobile and hardware. Filter by area:"
  />

  <!-- Toggle buttons with aria-pressed: simpler and more robust than a tablist here,
       because the filter narrows one list rather than switching between panels. -->
  <div class="filters" role="group" aria-label="Filter projects by area">
    @for (option of filterOptions; track option) {
      <button
        type="button"
        class="filter"
        [attr.aria-pressed]="selected() === option"
        [disabled]="counts[option] === 0"
        (click)="select(option)"
      >
        {{ option }}
        <span class="count" aria-hidden="true">{{ counts[option] }}</span>
      </button>
    }
  </div>

  <p class="visually-hidden" aria-live="polite">{{ resultMessage() }}</p>

  <ul class="grid">
    @for (project of visibleProjects(); track project.id) {
      <li><app-project-card [project]="project" /></li>
    }
  </ul>
</section>
