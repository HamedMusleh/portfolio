    <!--
      Apply the saved/OS theme before the first paint to avoid a light→dark flash.
      This must run before Angular boots, so it is a tiny inline script.
      ThemeService reads the same localStorage key afterwards.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
          // Dark-first: dark unless the OS explicitly reports a light preference.
          var dark = saved ? saved === 'dark' : mq ? mq.matches : true;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
